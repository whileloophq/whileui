appId: dev.whileloop.showcase
name: Docked field stays above the keyboard
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: 'Typography'
    timeout: 60000

# The clipped Smart Input on this page is not the proof. The full screen is.
- tapOn:
    text: '.*Open menu.*'
# The drawer fits on one screen, and centring an item in a list that cannot scroll
# fails, so the item is tapped directly.
- tapOn:
    text: '.*Layout.*'
- scrollUntilVisible:
    element:
      id: 'open-keyboard-screen'
    direction: DOWN
    centerElement: true
    visibilityPercentage: 50
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: 'open-keyboard-screen'
- assertVisible: 'The field and send button stay above the keyboard.'

# Typed with the keyboard open. Both controls have to remain on screen, then the
# word has to survive dismissal.
- tapOn:
    id: 'keyboard-message'
- inputText: 'hello'
- assertVisible:
    id: 'keyboard-message'
- assertVisible:
    id: 'keyboard-send'
# Send is tapped with the keyboard still up: reaching it while typing is the contract.
- tapOn:
    id: 'keyboard-send'
- assertVisible: 'Sent: hello'
