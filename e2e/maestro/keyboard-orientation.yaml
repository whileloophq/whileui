appId: dev.whileloop.showcase
name: Docked field stays reachable in landscape
# Back to portrait even when a step fails; a flow left in landscape broke every flow
# after it.
onFlowComplete:
  - setOrientation: PORTRAIT
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: 'Typography'
    timeout: 60000

- tapOn:
    text: '.*Open menu.*'
# The drawer fits on one screen, and centring an item in a list that cannot scroll
# fails, so the item is tapped directly.
- tapOn:
    text: '.*Layout.*'
- scrollUntilVisible:
    element:
      id: 'open-keyboard-screen'
    direction: DOWN
    centerElement: true
    visibilityPercentage: 50
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: 'open-keyboard-screen'
- assertVisible: 'The field and send button stay above the keyboard.'

- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: 'keyboard-message'
- assertVisible:
    id: 'keyboard-send'
- tapOn:
    id: 'keyboard-message'
- inputText: 'wide'
# Send is tapped with the keyboard still up: reaching it while typing is the contract.
- tapOn:
    id: 'keyboard-send'
# On a landscape Android phone the keyboard leaves room for the dock and little else, so
# the result line is under it; close the keyboard to read it. iOS shows it as is.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- assertVisible: 'Sent: wide'
- setOrientation: PORTRAIT
