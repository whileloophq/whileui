<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WhileUI — DOM track</title>
    <script>
      // Same key ThemeProvider persists to, read before first paint so dark mode
      // never flashes light. Anything but "light"/"dark" means follow the OS.
      (function () {
        var mode = localStorage.getItem('whileui.theme');
        var dark =
          mode === 'dark' ||
          (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
